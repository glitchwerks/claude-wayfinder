[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-wayfinder"
version = "0.3.2"
description = "A typed, auditable dispatch matcher for Claude Code — post-cognitive routing with a deterministic-first scoring kernel."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Christopher Beaulieu" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/glitchwerks/claude-wayfinder"
Issues = "https://github.com/glitchwerks/claude-wayfinder/issues"

[project.scripts]
claude-wayfinder = "claude_wayfinder.cli:main"
claude-wayfinder-match = "claude_wayfinder.match:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_wayfinder"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

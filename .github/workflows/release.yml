name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Build sdist + wheel
  # ---------------------------------------------------------------------------
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # verified 2026-05-17 via gh api repos/astral-sh/setup-uv/git/refs/tags/v8.1.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: "3.12"
          activate-environment: "true"

      - name: Build sdist and wheel
        run: uv build

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------------------
  # Publish to PyPI (stable tags only — no -rc / -alpha / -beta)
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref, '-rc') && !contains(github.ref, '-alpha') && !contains(github.ref, '-beta') }}
    environment:
      name: pypi
      url: https://pypi.org/p/claude-wayfinder
    permissions:
      id-token: write  # Required for trusted publisher OIDC
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # verified 2026-05-18 via gh api repos/pypa/gh-action-pypi-publish/git/refs/tags/v1.14.0 (annotated tag) → git/tags/<tag-sha>.object.sha
        # v1.9.0 → v1.14.0: older twine in v1.9.0 doesn't recognize Metadata-Version 2.4 emitted by modern hatchling (issue #115)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1

  # ---------------------------------------------------------------------------
  # Publish to TestPyPI (pre-release tags: -rc / -alpha / -beta)
  # ---------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    if: contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/claude-wayfinder
    permissions:
      id-token: write  # Required for trusted publisher OIDC
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        # verified 2026-05-18 via gh api repos/pypa/gh-action-pypi-publish/git/refs/tags/v1.14.0 (annotated tag) → git/tags/<tag-sha>.object.sha
        # v1.9.0 → v1.14.0: older twine in v1.9.0 doesn't recognize Metadata-Version 2.4 emitted by modern hatchling (issue #115)
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/

  # ---------------------------------------------------------------------------
  # Create GitHub Release (all tags — stable and pre-release)
  # ---------------------------------------------------------------------------
  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create GitHub Releases
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract CHANGELOG section for this release
        run: |
          # Strip the leading 'v' from the tag to match CHANGELOG headings
          # CHANGELOG uses "## [0.7.3]" while tags are "v0.7.3"
          VERSION="${GITHUB_REF_NAME#v}"
          awk '/^## \[/{if(flag)exit} /^## \['"$VERSION"'\]/{flag=1; next} flag' \
            CHANGELOG.md > release-notes.md
          echo "Extracted release notes for $VERSION:"
          cat release-notes.md

      - name: Create GitHub Release
        # verified 2026-05-21 via gh api repos/softprops/action-gh-release/git/refs/tags/v2.3.2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          body_path: release-notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}

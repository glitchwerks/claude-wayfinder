name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # verified 2026-05-13 via gh api repos/astral-sh/setup-uv/git/refs/tags/v8.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.11"
          activate-environment: "true"

      - name: Install ruff
        run: uv pip install ruff

      - name: Run ruff
        run: uv run --no-sync ruff check src/ tests/

  # ---------------------------------------------------------------------------
  # Tests — Python 3.11
  # ---------------------------------------------------------------------------
  test-py311:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # verified 2026-05-13 via gh api repos/astral-sh/setup-uv/git/refs/tags/v8.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.11"
          activate-environment: "true"

      - name: Install project with dev extras
        run: uv pip install -e ".[dev]"

      - name: Run pytest
        run: uv run --no-sync pytest -v --ignore=tests/integration

  # ---------------------------------------------------------------------------
  # Tests — Python 3.12
  # ---------------------------------------------------------------------------
  test-py312:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # verified 2026-05-13 via gh api repos/astral-sh/setup-uv/git/refs/tags/v8.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.12"
          activate-environment: "true"

      - name: Install project with dev extras
        run: uv pip install -e ".[dev]"

      - name: Run pytest
        run: uv run --no-sync pytest -v --ignore=tests/integration

  # ---------------------------------------------------------------------------
  # Tests — Node 20 (hook scripts)
  # ---------------------------------------------------------------------------
  test-node:
    name: Test (Node)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run hook tests
        run: node --test hooks/tests/*.test.js

  # ---------------------------------------------------------------------------
  # Skill smoke (ubuntu-latest + windows-latest matrix)
  # ---------------------------------------------------------------------------
  skill-smoke:
    name: Skill smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # verified 2026-05-13 via gh api repos/astral-sh/setup-uv/git/refs/tags/v8.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.12"
          activate-environment: "true"

      - name: Install pytest
        run: uv pip install pytest

      - name: Run skill smoke test
        env:
          CLAUDE_WAYFINDER_PIP_SPEC: ${{ github.workspace }}
        run: uv run --no-sync pytest tests/integration/test_setup_skill.py -v

  # ---------------------------------------------------------------------------
  # Actionlint — validate workflow YAML
  # ---------------------------------------------------------------------------
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        # verified 2026-05-21 via gh api repos/raven-actions/actionlint/git/refs/tags/v2.1.2
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8  # v2.1.2
        with:
          files: ".github/workflows/*.yml"

  # ---------------------------------------------------------------------------
  # Validate plugin manifest
  # ---------------------------------------------------------------------------
  validate-manifest:
    name: Validate Plugin Manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.210

      - name: Validate plugin manifest (official)
        run: claude plugin validate .claude-plugin/plugin.json

      # verified 2026-05-13 via gh api repos/astral-sh/setup-uv/git/refs/tags/v8.1.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          python-version: "3.11"
          activate-environment: "true"

      - name: Install project with dev extras
        run: uv pip install -e ".[dev]"

      - name: Run manifest validation tests
        run: uv run --no-sync pytest tests/test_plugin_manifests.py -v
